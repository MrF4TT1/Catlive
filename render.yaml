# Render Blueprint — CatAlive istanza privata (a singolo amministratore).
# Su https://dashboard.render.com → New → Blueprint → collega il repo GitHub.
# I valori "sync: false" vanno inseriti TU nella dashboard di Render (sono segreti).
services:
  - type: web
    name: catalive
    runtime: node
    plan: free
    # --include=dev: Vite e i tool di build sono in devDependencies; con NODE_ENV=production
    # npm li salterebbe e la build fallirebbe ("vite: not found"). --include=dev li forza.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20" # l'AWS SDK (R2) richiede Node >= 20
      - key: JWT_SECRET
        generateValue: true # generato e mantenuto da Render

      # --- Il TUO accesso amministratore (inseriscili nella dashboard Render) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- Database persistente: stringa di connessione Neon (Postgres) ---
      - key: DATABASE_URL
        sync: false

      # --- Archiviazione video: Cloudflare R2 (S3-compatibile) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
