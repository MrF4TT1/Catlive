# Render Blueprint — deploy "1 clic" di CatAlive (piano gratuito).
# Su https://dashboard.render.com → New → Blueprint → collega il repo GitHub.
services:
  - type: web
    name: catalive
    runtime: node
    plan: free
    # --include=dev: Vite e i tool di build sono in devDependencies; con NODE_ENV=production
    # npm li salterebbe e la build fallirebbe ("vite: not found"). --include=dev li forza.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
